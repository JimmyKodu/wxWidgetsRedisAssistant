name: Build and Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERSION: "1.0.0"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libwxgtk3.0-gtk3-dev libhiredis-dev
    
    - name: Build application
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
    
    - name: Package application
      run: |
        VERSION=${{ env.VERSION }}
        BUILD_DIR="build"
        PACKAGE_DIR="releases/v${VERSION}/linux"
        PACKAGE_NAME="RedisAssistant-${VERSION}-linux-x86_64"
        
        mkdir -p "$PACKAGE_DIR/$PACKAGE_NAME"
        
        # Copy executable
        cp "$BUILD_DIR/RedisAssistant" "$PACKAGE_DIR/$PACKAGE_NAME/"
        
        # Copy dependencies
        ldd "$BUILD_DIR/RedisAssistant" | grep "=> /" | grep -E "libwx|hiredis" | awk '{print $3}' | while read lib; do
            cp "$lib" "$PACKAGE_DIR/$PACKAGE_NAME/" 2>/dev/null || true
        done
        
        # Create launcher script from template
        cp scripts/run.sh.template "$PACKAGE_DIR/$PACKAGE_NAME/run.sh"
        chmod +x "$PACKAGE_DIR/$PACKAGE_NAME/run.sh"
        
        # Create README
        cat > "$PACKAGE_DIR/$PACKAGE_NAME/README.txt" << EOF
        Redis Assistant v${VERSION} - Linux Build
        
        To run the application:
            ./run.sh
        
        Requirements:
        - This is a self-contained build with all required dependencies included.
        - Linux x86_64 system
        
        For more information, visit: https://github.com/JimmyKodu/wxWidgetsRedisAssistant
        EOF
        
        # Create archive
        cd "$PACKAGE_DIR"
        tar -czf "${PACKAGE_NAME}.tar.gz" "$PACKAGE_NAME"
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: releases/v${{ env.VERSION }}/linux/*.tar.gz

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install wxwidgets:x64-windows hiredis:x64-windows
    
    - name: Build application
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=..\vcpkg\scripts\buildsystems\vcpkg.cmake -A x64
        cmake --build . --config Release
    
    - name: Package application
      shell: pwsh
      run: |
        $VERSION = "${{ env.VERSION }}"
        $BUILD_DIR = "build"
        $PACKAGE_DIR = "releases\v$VERSION\windows"
        $PACKAGE_NAME = "RedisAssistant-$VERSION-windows-x64"
        
        New-Item -ItemType Directory -Force -Path "$PACKAGE_DIR\$PACKAGE_NAME"
        
        # Copy executable
        Copy-Item "$BUILD_DIR\Release\RedisAssistant.exe" "$PACKAGE_DIR\$PACKAGE_NAME\"
        
        # Copy vcpkg DLLs
        $vcpkgBin = "vcpkg\installed\x64-windows\bin"
        if (Test-Path $vcpkgBin) {
            Get-ChildItem -Path $vcpkgBin -Filter *.dll | ForEach-Object {
                Copy-Item $_.FullName "$PACKAGE_DIR\$PACKAGE_NAME\"
            }
        }
        
        # Create README
        @"
        Redis Assistant v$VERSION - Windows Build
        
        To run the application:
            Double-click RedisAssistant.exe
        
        Requirements:
        - This is a self-contained build with all required dependencies included.
        - Windows 10/11 x64 system
        
        For more information, visit: https://github.com/JimmyKodu/wxWidgetsRedisAssistant
        "@ | Out-File -FilePath "$PACKAGE_DIR\$PACKAGE_NAME\README.txt" -Encoding UTF8
        
        # Create archive
        Compress-Archive -Path "$PACKAGE_DIR\$PACKAGE_NAME" -DestinationPath "$PACKAGE_DIR\$PACKAGE_NAME.zip"
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: releases/v${{ env.VERSION }}/windows/*.zip

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        draft: false
        prerelease: false
        files: |
          linux-release/*
          windows-release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
